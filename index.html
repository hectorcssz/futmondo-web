<title>NECES LDA LEAGUE</title>
<style>
  :root {
    --plane: #eef1f5; --surface: #ffffff; --ink: #10202b; --ink-2: #56687a;
    --ink-3: #5e7183; --hairline: #e3e8ee; --accent: #307828; --down: #c03b2d;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--plane); color: var(--ink);
    font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  .puerta {
    width: 100%; max-width: 380px; background: var(--surface);
    border-radius: 10px; padding: 28px 24px;
    box-shadow: 0 1px 2px rgba(16,32,43,0.06), 0 8px 24px rgba(16,32,43,0.08);
  }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin: 0 0 22px; font-size: 11px; color: var(--ink-2); }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--ink-3);
          text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; padding: 10px 12px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 7px; margin-bottom: 12px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; font: inherit; font-weight: 600; padding: 11px 12px;
    color: #fff; background: var(--accent); border: none; border-radius: 7px; cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .aviso { margin: 12px 0 0; font-size: 11px; min-height: 15px; }
  .aviso.error { color: var(--down); }
  .aviso.trabajando { color: var(--ink-2); }
</style>

  function b64(s) {
    var bin = atob(s), b = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b;
  }

  var form = document.getElementById('puerta');
  var campo = document.getElementById('clave');
  var boton = document.getElementById('entrar');
  var aviso = document.getElementById('aviso');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    abrir(campo.value);
  });

  // Prueba la contraseña contra cada sobre hasta que uno se abra: el que lo haga
  // devuelve la clave interna con la que está cifrado el dashboard.
  function abrirSobre(clave, i) {
    if (i >= SOBRES.length) return Promise.reject();
    var s = SOBRES[i];
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          {name: 'PBKDF2', salt: b64(s.sal), iterations: ITER, hash: 'SHA-256'},
          base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      })
      .then(function (kek) {
        return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(s.iv)}, kek, b64(s.cek));
      })
      .then(function (cek) {
        return crypto.subtle.importKey('raw', cek, 'AES-GCM', false, ['decrypt']);
      })
      .catch(function () { return abrirSobre(clave, i + 1); });
  }

  function abrir(clave) {
    if (!clave) return;
    boton.disabled = true;
    aviso.className = 'aviso trabajando';
    aviso.textContent = 'Descifrando…';

    abrirSobre(clave, 0)
      .then(function (k) {
        return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(IV)}, k, b64(DATOS));
      })
      .then(function (claro) {
        var html = new TextDecoder().decode(claro);
        // reemplaza el documento entero: los scripts del dashboard se ejecutan
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        boton.disabled = false;
        aviso.className = 'aviso error';
        aviso.textContent = 'Contraseña incorrecta.';
        campo.select();
      });
